<app-navbar></app-navbar>

<div class="container py-4">

  <div class="card shadow border-0">
    
    <!-- HEADER -->
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Registrar Nuevo Taller</h4>
      <small>Ingresa la información del taller y su administrador</small>
    </div>

    <div class="card-body">

      <form [formGroup]="form" (ngSubmit)="crearTaller()">

        <!-- DATOS DEL TALLER -->
        <h5 class="mb-3">🏭 Datos del Taller</h5>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre del taller</label>
            <input 
              type="text" 
              class="form-control"
              [ngClass]="{'is-invalid': campoInvalido('nombreTaller')}"
              formControlName="nombreTaller"/>

            <div class="invalid-feedback">
              Mínimo 3 caracteres
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Teléfono</label>
            <input 
              type="text" 
              class="form-control"
              [ngClass]="{'is-invalid': campoInvalido('telefono')}"
              formControlName="telefono"/>

            <div class="invalid-feedback">
              Debe tener 10 dígitos
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Dirección</label>
          <input 
            type="text" 
            class="form-control"
            [ngClass]="{'is-invalid': campoInvalido('direccion')}"
            formControlName="direccion"/>

          <div class="invalid-feedback">
            Mínimo 5 caracteres
          </div>
        </div>

        <hr>

        <!-- ADMIN -->
        <h5 class="mb-3">👤 Administrador</h5>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre</label>
            <input 
              type="text" 
              class="form-control"
              [ngClass]="{'is-invalid': campoInvalido('nombreAdmin')}"
              formControlName="nombreAdmin"/>

            <div class="invalid-feedback">
              Nombre inválido
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input 
              type="email" 
              class="form-control"
              [ngClass]="{'is-invalid': campoInvalido('emailAdmin')}"
              formControlName="emailAdmin"/>

            <div class="invalid-feedback">
              Email inválido
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input 
            type="password" 
            class="form-control"
            [ngClass]="{'is-invalid': campoInvalido('passwordAdmin')}"
            formControlName="passwordAdmin"/>

          <div class="invalid-feedback">
            Mínimo 6 caracteres
          </div>
        </div>

        <!-- ERROR -->
        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <!-- BOTONES -->
        <div class="d-flex flex-column flex-md-row gap-2 mt-3">

          <button 
            class="btn btn-success flex-fill"
            type="submit"
            [disabled]="form.invalid || loading">

            <span *ngIf="!loading">
              <i class="bi bi-check-lg me-1"></i> Crear Taller
            </span>

            <span *ngIf="loading">
              <span class="spinner-border spinner-border-sm me-2"></span>
              Creando...
            </span>

          </button>

          <button 
            class="btn btn-outline-secondary flex-fill"
            routerLink="/dashboard">

            <i class="bi bi-arrow-left me-1"></i> Volver

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
