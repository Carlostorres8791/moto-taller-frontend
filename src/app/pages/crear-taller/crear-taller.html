<app-navbar></app-navbar>

<div class="container mt-4">
  <h2>Registrar Nuevo Taller</h2>
  <h3>Ingresa los datos del nuevo Taller</h3>

  <form (ngSubmit)="crearTaller()">
    <div class="mb-3">
      <label>Nombre del taller</label>
      <input type="text" class="form-control" [(ngModel)]="request.nombreTaller" name="nombre" />
    </div>

    <div class="mb-3">
      <label>Dirección</label>
      <input type="text" class="form-control" [(ngModel)]="request.direccion" name="direccion" />
    </div>

    <div class="mb-3">
      <label>Teléfono</label>
      <input type="text" class="form-control" [(ngModel)]="request.telefono" name="telefono">
    </div>

    <hr />

    <h2>Registro del Administrador</h2>
    <h3>Ingresa los datos del administrador del taller</h3>

    <div class="mb-3">
      <label>Nombre del Administrador</label>
      <input type="text" class="form-control" [(ngModel)]="request.nombreAdmin" name="nombreAdmin"/>
    </div>

    <div class="mb-3">
      <label>Email del Administrador</label>
      <input type="email" class="form-control" [(ngModel)]="request.emailAdmin" name="emailAdmin"/>
    </div>

    <div class="mb-3">
      <label>Contraseña</label>
      <input type="text" class="form-control" [(ngModel)]="request.passwordAdmin" name="passwordAdmin">
    </div>

    <button class="btn btn-success w-100" [disabled]="">Crear Taller</button>
    <hr>
    <button class="btn btn-primary w-100" routerLink="/dashboard">Salir</button>
  </form>
</div>
