<app-navbar></app-navbar>

<div class="container mt-4">
  <h3 class="fw-bold">Registrar Cliente</h3>

  <form (ngSubmit)="crearCliente()" #form="ngForm">

    <div class="mb-3">
      <label>Nombre</label>
      <input type="text" class="form-control" [(ngModel)]="cliente.nombre" name="nombre" required>
    </div>

    <div class="mb-3">
      <label>Teléfono</label>
      <input type="text" class="form-control" [(ngModel)]="cliente.telefono" name="telefono">
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="cliente.email" name="email">
    </div>

    <button class="btn btn-primary">Guardar</button>
  </form>
</div>
