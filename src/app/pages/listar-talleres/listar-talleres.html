<app-navbar></app-navbar>

<div class="container mt-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-1">Listado de Talleres</h4>
      <small class="text-muted">Gestión de talleres registrados</small>
    </div>

    <a routerLink="/crear-taller" class="btn btn-primary">
      + Nuevo Taller
    </a>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary"></div>
  </div>

  <!-- ERROR -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- TABLA -->
  <div class="card shadow-sm border-0" *ngIf="!loading && talleres.length > 0">
    
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Administrador</th>
            <th>Email</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let t of talleres; let i = index">
            <td>{{ i + 1 }}</td>
            <td class="fw-semibold">{{ t.nombre }}</td>
            <td>{{ t.direccion }}</td>
            <td>{{ t.telefono }}</td>
            <td>{{ t.nombreAdmin }}</td>
            <td>{{ t.emailAdmin }}</td>

            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-2">
                Editar
              </button>

              <!--
              <button 
                class="btn btn-sm btn-outline-danger"
                (click)="eliminarTaller(t.id)">
                Eliminar
              </button>-->
            </td>
          </tr>
        </tbody>

      </table>
    </div>

  </div>

  <!-- VACÍO -->
  <div *ngIf="!loading && talleres.length === 0" class="text-center mt-4">
    <p class="text-muted">No hay talleres registrados</p>
  </div>

</div>
